# AdReceipts runs as `python adreceipts.py`; this file only records metadata
# and the optional extra. It is not published to PyPI.
[project]
name = "adreceipts"
version = "0.1.0"
description = "Your AI agent finds the ads built into your Android phone, removes them, and shows the before/after proof. No root. Every change can be undone."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kc13160" }]
dependencies = []

[project.optional-dependencies]
share = ["Pillow>=9"]
dev = ["pytest>=7", "PyYAML>=6", "jsonschema>=4", "Pillow>=9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
